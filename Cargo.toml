[package]
name = "cuckoo-bench"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = "1.8.7"
rand = "0.10.3"
rand_chacha = "0.10.0"
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
xxhash-rust = { version = "0.8.19", features = ["xxh32", "xxh64", "xxh3"] }

[lib]
name = "cuckoo_bench"
path = "src/lib.rs"

[[bin]]
name = "cuckoo-bench"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
